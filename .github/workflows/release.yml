name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -project FocusBar.xcodeproj \
            -scheme FocusBar \
            -destination 'platform=macOS' \
            -only-testing:FocusBarTests \
            -derivedDataPath DerivedData

      - name: Build Universal Release
        run: |
          xcodebuild -project FocusBar.xcodeproj \
            -scheme FocusBar \
            -configuration Release \
            -derivedDataPath DerivedData \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: CodeSign App
        run: |
          APP_PATH="DerivedData/Build/Products/Release/FocusBar.app"
          if [ -d "$APP_PATH" ]; then
            codesign --force --deep --sign - "$APP_PATH"
            codesign --verify --deep --strict "$APP_PATH"
            lipo -info "$APP_PATH/Contents/MacOS/FocusBar"
          else
            echo "App not found at: $APP_PATH"
            exit 1
          fi

      - name: Create Artifact
        run: |
          APP_PATH="DerivedData/Build/Products/Release/FocusBar.app"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" FocusBar.app.zip
          ls -lh FocusBar.app.zip

      - name: Generate Changelog
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log --pretty=format:"- %s (%h)" "$PREV_TAG..HEAD")
          else
            CHANGES=$(git log --pretty=format:"- %s (%h)" -10)
          fi

          {
            echo "**Version**: $TAG_NAME"
            echo ""
            echo "### Changes"
            printf '%s\n' "${CHANGES:-"- Initial release"}"
          } > changelog.txt

          cat changelog.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: changelog.txt
          files: FocusBar.app.zip
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup
        if: always()
        run: |
          rm -rf DerivedData
          rm -f FocusBar.app.zip changelog.txt
