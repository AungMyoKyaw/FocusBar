name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -project FocusBar.xcodeproj \
            -scheme FocusBar \
            -destination 'platform=macOS' \
            -only-testing:FocusBarTests \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Configure Signing & Build Universal Release
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'temporary-ci-password' }}
        run: |
          if [ -n "$APPLE_CERTIFICATE_BASE64" ]; then
            echo "Importing Apple Developer Certificate into temporary keychain..."
            KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

            CERT_PATH=$RUNNER_TEMP/certificate.p12
            echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
            security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "${APPLE_CERTIFICATE_PASSWORD:-}" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

            echo "Building with Apple Developer certificate..."
            xcodebuild -project FocusBar.xcodeproj \
              -scheme FocusBar \
              -configuration Release \
              -derivedDataPath DerivedData \
              ARCHS="arm64 x86_64" \
              ONLY_ACTIVE_ARCH=NO \
              DEVELOPMENT_TEAM=ZSQUH7GKC5 \
              CODE_SIGNING_REQUIRED=YES \
              CODE_SIGNING_ALLOWED=YES \
              build
          else
            echo "::warning::APPLE_CERTIFICATE_BASE64 secret not found. Building universal binary with ad-hoc signing for GitHub asset release."
            xcodebuild -project FocusBar.xcodeproj \
              -scheme FocusBar \
              -configuration Release \
              -derivedDataPath DerivedData \
              ARCHS="arm64 x86_64" \
              ONLY_ACTIVE_ARCH=NO \
              CODE_SIGN_IDENTITY=- \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              build

            codesign --force --deep --sign - "DerivedData/Build/Products/Release/FocusBar.app"
          fi

      - name: Verify Code Signature
        run: |
          APP_PATH="DerivedData/Build/Products/Release/FocusBar.app"
          if [ -d "$APP_PATH" ]; then
            codesign --verify --deep --strict "$APP_PATH"
            codesign -dvvv "$APP_PATH"
            lipo -info "$APP_PATH/Contents/MacOS/FocusBar"
          else
            echo "App not found at: $APP_PATH"
            exit 1
          fi

      - name: Create Artifact
        run: |
          APP_PATH="DerivedData/Build/Products/Release/FocusBar.app"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" FocusBar.app.zip
          ls -lh FocusBar.app.zip

      - name: Generate Changelog
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log --pretty=format:"- %s (%h)" "$PREV_TAG..HEAD")
          else
            CHANGES=$(git log --pretty=format:"- %s (%h)" -10)
          fi

          {
            echo "**Version**: $TAG_NAME"
            echo ""
            echo "### Changes"
            printf '%s\n' "${CHANGES:-"- Initial release"}"
          } > changelog.txt

          cat changelog.txt

      - name: Upload Artifact (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: FocusBar.app
          path: FocusBar.app.zip

      - name: Create Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          body_path: changelog.txt
          files: FocusBar.app.zip
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup
        if: always()
        run: |
          rm -rf DerivedData
          rm -f FocusBar.app.zip changelog.txt
