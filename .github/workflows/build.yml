name: Build

on:
  push:
    branches: [master, '*']
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Runner & Xcode Versions
        run: |
          sw_vers
          uname -m
          xcodebuild -version

      - name: Build and Run Unit Tests
        run: |
          xcodebuild test \
            -project FocusBar.xcodeproj \
            -scheme FocusBar \
            -destination 'platform=macOS' \
            -only-testing:FocusBarTests \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify Mac App Store Build (Unsigned)
        run: |
          xcodebuild build \
            -project FocusBar.xcodeproj \
            -scheme FocusBar \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath DerivedData-AppStore \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_ENTITLEMENTS=FocusBar/FocusBar-AppStore.entitlements \
            OTHER_SWIFT_FLAGS='$(inherited) -DMAC_APP_STORE' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Cleanup
        if: always()
        run: rm -rf DerivedData DerivedData-AppStore
